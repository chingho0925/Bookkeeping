<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>和風帳簿 (排版與總覽優化版)</title>
    <!-- Firebase 官方套件 -->
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
    <!-- Chart.js 圖表套件 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SortableJS 拖曳套件 -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        
        * { box-sizing: border-box; }
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: #F9F3EC; 
            background-image: radial-gradient(#D6C5B3 1px, transparent 1px);
            background-size: 20px 20px;
            color: #4A3B32; 
            margin: 0; 
            padding: 0; 
        }
        
        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #F9F3EC; z-index: 2000;
            display: flex; justify-content: center; align-items: center;
            font-size: 18px; font-weight: bold; color: #84A59D;
        }
        #network-status {
            background-color: #E07A5F; color: white; text-align: center;
            padding: 6px; font-size: 12px; font-weight: bold; display: none;
        }

        .app-container {
            max-width: 600px; margin: 0 auto; padding: 15px; padding-bottom: 60px;
            display: none; 
        }

        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #F9F3EC; background-image: radial-gradient(#D6C5B3 1px, transparent 1px);
            background-size: 20px 20px; z-index: 1000;
            display: none; justify-content: center; align-items: center; flex-direction: column; padding: 20px;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95); padding: 35px 25px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center;
            border-top: 6px solid #84A59D;
        }
        .login-card h2 { color: #2F3E46; margin-top: 0; font-size: 22px; }
        .login-card p { font-size: 13px; color: #84A59D; margin-bottom: 25px; }

        .header { 
            background-color: #2F3E46; color: #F9F3EC; padding: 15px 20px; 
            border-radius: 12px; 
            display: grid; 
            grid-template-columns: 40px 1fr 40px; 
            align-items: center; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            min-height: 60px;
        }
        .menu-btn { 
            background: none; border: none; color: #F9F3EC; 
            font-size: 24px; cursor: pointer; padding: 0; margin: 0; 
            line-height: 1; z-index: 5;
        }
        .header-title-container { text-align: center; }
        .header h1 { margin: 0; font-size: 20px; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .trip-period-text { font-size: 12px; opacity: 0.8; margin-top: 4px; color: #D6C5B3; }

        .sidebar-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; z-index: 99; backdrop-filter: blur(2px); }
        .sidebar { position: fixed; top: 0; left: -300px; width: 300px; height: 100%; background-color: #F9F3EC; box-shadow: 2px 0 10px rgba(0,0,0,0.2); z-index: 100; transition: left 0.3s ease; display: flex; flex-direction: column; }
        .sidebar.open { left: 0; }
        .sidebar-overlay.open { display: block; }
        .sidebar-header { background-color: #2F3E46; color: #F9F3EC; padding: 20px; font-size: 18px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .sidebar-content { padding: 15px; flex-grow: 1; overflow-y: auto; }
        
        .trip-menu-item { position: relative; padding: 10px 12px; margin-bottom: 8px; background: white; border-radius: 8px; border-left: 5px solid #D6C5B3; cursor: pointer; display: flex; align-items: center; transition: background 0.2s; overflow: hidden; }
        .trip-menu-item.active { border-left-color: #84A59D; background-color: #E8F0EE; }
        .folder-item { margin-bottom: 8px; }
        .folder-header { padding: 10px 15px; background: #EAE2D6; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: #2F3E46; }
        .folder-content { padding-left: 12px; margin-left: 12px; border-left: 2px dashed #D6C5B3; margin-top: 8px; min-height: 40px; padding-bottom: 5px; } 
        
        .sidebar-cb { width: 18px; height: 18px; cursor: pointer; margin: 0; margin-right: 10px; flex-shrink: 0; }
        
        .card { background: rgba(255, 255, 255, 0.95); padding: 18px; border-radius: 12px; margin-top: 15px; border-left: 6px solid #84A59D; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .budget-bar { background-color: #EAE2D6; border-radius: 8px; height: 18px; width: 100%; overflow: hidden; margin-top: 10px; }
        .budget-fill { background-color: #F28482; height: 100%; width: 0%; transition: width 0.4s ease, background-color 0.4s ease; }
        
        .filter-container { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 10px; }
        .filter-chip { padding: 6px 12px; background: #EAE2D6; border-radius: 16px; font-size: 12px; cursor: pointer; white-space: nowrap; color: #4A3B32; }
        .filter-chip.active { background: #84A59D; color: white; font-weight: bold; }
        
        #expense-list { overflow-y: auto; padding-right: 5px; } 
        .date-header { font-size: 13px; font-weight: bold; color: #2F3E46; padding: 8px 0 4px 0; border-bottom: 2px solid #84A59D; margin-top: 12px; }
        
        /* 消費項目防反白及長按互動樣式 */
        .expense-item { 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px dashed #D6C5B3; padding: 10px 5px; 
            cursor: pointer; transition: background 0.2s;
            -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
        }
        .expense-item:active { background-color: #E8F0EE; border-radius: 8px; }

        input, select, button { width: 100%; padding: 11px; margin-top: 8px; border: 1px solid #D6C5B3; border-radius: 8px; font-family: inherit; font-size: 14px; background: white; box-sizing: border-box; }
        input[type="date"] { color: #E07A5F; font-weight: bold; }
        button.primary-btn { background-color: #84A59D; color: white; border: none; font-weight: bold; cursor: pointer; font-size: 15px; margin-top: 12px; transition: background 0.2s; }
        button.primary-btn:hover { background-color: #6C8D85; }
        .btn-google { background-color: #4285F4; margin-top: 10px; font-size: 16px; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .btn-logout { background-color: #E07A5F; color: white; border: none; font-weight: bold; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 10px; }

        .form-group { display: flex; gap: 8px; }
        .form-group > div { flex: 1; }
        .real-time-preview { font-size: 13px; color: #84A59D; margin-top: 4px; text-align: right; font-weight: bold; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 200; justify-content: center; align-items: center; padding: 20px; }
        .modal.open { display: flex; }
        .modal-content { background: white; padding: 20px; border-radius: 12px; width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto; }
        
        .summary-table-container { max-height: 60vh; overflow-y: auto; border: 1px solid #D6C5B3; border-radius: 8px; margin-top: 10px; }
        .summary-table { width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap; }
        .summary-table th, .summary-table td { border-bottom: 1px dashed #D6C5B3; padding: 8px 10px; text-align: left; }
        .summary-table th { background-color: #E8F0EE; color: #2F3E46; position: sticky; top: 0; z-index: 10; border-bottom: 2px solid #84A59D; }
        .summary-table tfoot th, .summary-table tfoot td { font-weight: bold; background-color: #F9F3EC; border-top: 2px solid #84A59D; position: sticky; bottom: 0; }

        .payer-tag { display: inline-block; background: #E8F0EE; color: #2F3E46; padding: 2px 6px; border-radius: 4px; font-size: 11px; margin-left: 4px; border: 1px solid #84A59D; }
        .date-tag { display: inline-block; background: #F9F3EC; color: #4A3B32; padding: 2px 6px; border-radius: 4px; font-size: 11px; margin-left: 6px; border: 1px solid #D6C5B3; }
        
        .toggle-label { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-bottom: 10px; cursor: pointer; padding: 8px; background: #F9F3EC; border-radius: 8px;}
        .toggle-label input[type="checkbox"] { width: auto; margin: 0; cursor: pointer; transform: scale(1.2); }
        .inline-checkbox-label { font-size: 13px; display: flex; align-items: center; gap: 4px; cursor: pointer; white-space: nowrap; margin-top: 8px; padding: 11px 8px; border-radius: 8px; background: #E8F0EE; border: 1px solid #84A59D; }
        .inline-checkbox-label input { margin: 0; width: auto; }
        .manage-btn { width: auto; margin-top: 0; padding: 11px 13px; background: #E8F0EE; color: #2F3E46; border: 1px solid #84A59D; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="network-status">📡 目前為離線狀態 (資料儲存於本機)</div>
    <div id="loading-overlay">⏳ 正在連線雲端資料，請稍候...</div>

    <!-- 登入畫面 -->
    <div id="login-overlay">
        <div class="login-card">
            <h2>⛩️ 和風帳簿</h2>
            <p>請登入您的帳號，以啟用跨裝置雲端同步功能</p>
            <button class="primary-btn btn-google" onclick="loginWithGoogle()">
                <span style="font-size:20px; background:white; border-radius:50%; padding:2px 4px; color:#4285F4;">G</span>
                使用 Google 帳號登入
            </button>
        </div>
    </div>

    <!-- 側邊欄 -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar(false)"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span>⛩ 帳本與資料夾</span>
            <span style="cursor:pointer;" onclick="toggleSidebar(false)">✕</span>
        </div>
        <div class="sidebar-content">
            <div id="user-info" style="font-size:13px; color:#84A59D; margin-bottom:10px; text-align:center;"></div>
            <p style="font-size:11px; color:#84A59D; margin:0 0 10px 0; text-align:center;" id="drag-hint">💡 提示：長按項目可拖曳移入資料夾或排序</p>
            
            <div id="sidebar-items-container"></div>
            
            <div id="sidebar-normal-actions">
                <div style="display: flex; gap: 8px; margin-top: 15px;">
                    <button class="primary-btn" style="flex: 1;" onclick="openAddTripModal()">➕ 新帳本</button>
                    <button class="primary-btn" style="flex: 1; background-color: #D6C5B3; color: #2F3E46;" onclick="createFolder()">📁 新資料夾</button>
                </div>
                <button class="primary-btn" style="background-color: #94D2BD; color: #2F3E46; margin-top: 10px;" onclick="openSummaryModal()">📊 消費總覽</button>
                <button class="primary-btn" style="background-color: #5B7B7A; margin-top: 10px;" onclick="exportToCSV()">📥 匯出 CSV 報表</button>
                <button class="primary-btn" style="background-color: #E07A5F; margin-top: 10px;" onclick="toggleSidebarEditMode()">📝 批次管理 / 刪除</button>
                <button class="btn-logout" onclick="logoutApp()">🚪 登出帳號</button>
            </div>

            <div id="sidebar-edit-actions" style="display: none; margin-top: 15
