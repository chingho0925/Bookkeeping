<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>和風旅行帳簿 (安全防護版)</title>
    <!-- Firebase 官方套件 -->
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
    <!-- Chart.js 圖表套件 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        
        * { box-sizing: border-box; }
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: #F9F3EC; 
            background-image: radial-gradient(#D6C5B3 1px, transparent 1px);
            background-size: 20px 20px;
            color: #4A3B32; 
            margin: 0; 
            padding: 0; 
        }
        
        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #F9F3EC; z-index: 2000;
            display: flex; justify-content: center; align-items: center;
            font-size: 18px; font-weight: bold; color: #84A59D;
        }
        #network-status {
            background-color: #E07A5F; color: white; text-align: center;
            padding: 6px; font-size: 12px; font-weight: bold; display: none;
        }

        .app-container {
            max-width: 600px; margin: 0 auto; padding: 15px; padding-bottom: 60px;
            display: none; 
        }

        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #F9F3EC; background-image: radial-gradient(#D6C5B3 1px, transparent 1px);
            background-size: 20px 20px; z-index: 1000;
            display: none; justify-content: center; align-items: center; flex-direction: column; padding: 20px;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95); padding: 35px 25px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center;
            border-top: 6px solid #84A59D;
        }
        .login-card h2 { color: #2F3E46; margin-top: 0; font-size: 22px; }
        .login-card p { font-size: 13px; color: #84A59D; margin-bottom: 25px; }

        .header { 
            background-color: #2F3E46; color: #F9F3EC; padding: 15px 20px; 
            border-radius: 12px; 
            display: grid; 
            grid-template-columns: 40px 1fr 40px; 
            align-items: center; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            min-height: 60px;
        }
        .menu-btn { 
            background: none; border: none; color: #F9F3EC; 
            font-size: 24px; cursor: pointer; padding: 0; margin: 0; 
            line-height: 1; z-index: 5; justify-self: start;
        }
        .header-title-container { text-align: center; }
        .header h1 { margin: 0; font-size: 20px; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .edit-title-icon { font-size: 14px; cursor: pointer; opacity: 0.7; }
        .trip-period-text { font-size: 12px; opacity: 0.8; margin-top: 4px; color: #D6C5B3; }

        .sidebar-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; z-index: 99; backdrop-filter: blur(2px); }
        .sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background-color: #F9F3EC; box-shadow: 2px 0 10px rgba(0,0,0,0.2); z-index: 100; transition: left 0.3s ease; display: flex; flex-direction: column; }
        .sidebar.open { left: 0; }
        .sidebar-overlay.open { display: block; }
        .sidebar-header { background-color: #2F3E46; color: #F9F3EC; padding: 20px; font-size: 18px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .sidebar-content { padding: 15px; flex-grow: 1; overflow-y: auto; }
        .trip-menu-item { padding: 12px 15px; margin-bottom: 8px; background: white; border-radius: 8px; border-left: 5px solid #D6C5B3; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .trip-menu-item.active { border-left-color: #84A59D; background-color: #E8F0EE; font-weight: bold; }
        
        .card { background: rgba(255, 255, 255, 0.95); padding: 18px; border-radius: 12px; margin-top: 15px; border-left: 6px solid #84A59D; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .budget-bar { background-color: #EAE2D6; border-radius: 8px; height: 18px; width: 100%; overflow: hidden; margin-top: 10px; }
        .budget-fill { background-color: #F28482; height: 100%; width: 0%; transition: width 0.4s ease, background-color 0.4s ease; }
        
        .filter-container { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 10px; }
        .filter-chip { padding: 6px 12px; background: #EAE2D6; border-radius: 16px; font-size: 12px; cursor: pointer; white-space: nowrap; color: #4A3B32; }
        .filter-chip.active { background: #84A59D; color: white; font-weight: bold; }
        
        .date-header { font-size: 13px; font-weight: bold; color: #2F3E46; padding: 8px 0 4px 0; border-bottom: 2px solid #84A59D; margin-top: 12px; }
        .expense-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #D6C5B3; padding: 10px 0; }

        input, select, button { width: 100%; padding: 11px; margin-top: 8px; border: 1px solid #D6C5B3; border-radius: 8px; font-family: inherit; font-size: 14px; background: white; box-sizing: border-box; }
        input[type="date"] { color: #E07A5F; font-weight: bold; }
        button.primary-btn { background-color: #84A59D; color: white; border: none; font-weight: bold; cursor: pointer; font-size: 15px; margin-top: 12px; }
        .btn-secondary { background-color: #2F3E46; color: white; }
        .btn-google { background-color: #4285F4; margin-top: 10px; font-size: 16px; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .btn-logout { background-color: #E07A5F; color: white; border: none; font-weight: bold; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 10px; }

        .form-group { display: flex; gap: 8px; }
        .form-group > div { flex: 1; }
        .delete-btn { background: none; border: none; color: #F28482; cursor: pointer; padding: 3px 6px; width: auto; font-size: 12px; margin-top: 4px; border-radius: 4px; border: 1px solid #F28482; }
        .real-time-preview { font-size: 13px; color: #84A59D; margin-top: 4px; text-align: right; font-weight: bold; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 200; justify-content: center; align-items: center; padding: 20px; }
        .modal.open { display: flex; }
        .modal-content { background: white; padding: 20px; border-radius: 12px; width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto; }
        .api-result-box { background-color: #E8F0EE; border: 1px solid #84A59D; padding: 10px; border-radius: 8px; margin-top: 10px; font-size: 13px; }

        .context-menu { display: none; position: absolute; background: white; border: 1px solid #D6C5B3; box-shadow: 0 4px 10px rgba(0,0,0,0.1); z-index: 1000; border-radius: 8px; overflow: hidden; min-width: 120px; }
        .context-menu-item { padding: 10px 15px; cursor: pointer; font-size: 14px; color: #4A3B32; }
        .context-menu-item:hover { background-color: #E8F0EE; }
        .context-menu-item.danger { color: #F28482; border-top: 1px solid #eee; }

        .payer-tag { display: inline-block; background: #E8F0EE; color: #2F3E46; padding: 2px 6px; border-radius: 4px; font-size: 11px; margin-left: 4px; border: 1px solid #84A59D; }
    </style>
</head>
<body>

    <div id="network-status">📡 目前為離線狀態 (資料儲存於本機)</div>
    <div id="loading-overlay">⏳ 正在連線雲端資料，請稍候...</div>

    <!-- 登入畫面 -->
    <div id="login-overlay">
        <div class="login-card">
            <h2>⛩️ 和風旅行帳簿</h2>
            <p>請登入您的帳號，以啟用跨裝置雲端同步功能</p>
            <button class="primary-btn btn-google" onclick="loginWithGoogle()">
                <span style="font-size:20px; background:white; border-radius:50%; padding:2px 4px; color:#4285F4;">G</span>
                使用 Google 帳號登入
            </button>
        </div>
    </div>

    <!-- 側邊欄 -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar(false)"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span>⛩️️ 旅程選擇</span>
            <span style="cursor:pointer;" onclick="toggleSidebar(false)">✕</span>
        </div>
        <div class="sidebar-content">
            <div id="user-info" style="font-size:13px; color:#84A59D; margin-bottom:10px; text-align:center;"></div>
            <div id="trip-list-container"></div>
            <button class="primary-btn" onclick="openAddTripModal()">➕ 新增旅行</button>
            <button class="primary-btn btn-secondary" onclick="openRatesModal()">💱 匯率設定</button>
            <button class="primary-btn" style="background-color: #5B7B7A;" onclick="exportToCSV()">📥 匯出 CSV 報表</button>
            <button class="btn-logout" onclick="logoutApp()">🚪 登出帳號</button>
        </div>
    </div>

    <!-- 主介面 -->
    <div class="app-container" id="main-app">
        <div class="header">
            <button class="menu-btn" onclick="toggleSidebar(true)">☰</button>
            <div class="header-title-container">
                <h1>
                    <span id="header-trip-name">載入中...</span>
                    <span class="edit-title-icon" onclick="openEditTripModal()">✏️️</span>
                </h1>
                <div id="header-trip-period" class="trip-period-text">--</div>
            </div>
            <div></div>
        </div>

        <!-- 預算卡片 -->
        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3 style="margin: 0; color: #2F3E46;">預算進度 (TWD)</h3>
                <span style="font-size:12px; color:#84A59D; cursor:pointer;" onclick="openEditTripModal()">修改預算 ✏️</span>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 14px; margin-top: 10px;">
                <span>已花費: $<strong id="total-spent" style="font-size: 17px; color:#E07A5F;">0</strong></span>
                <span>總預算: $<strong id="total-budget" style="font-size: 17px;">0</strong></span>
            </div>
            <div class="budget-bar"><div class="budget-fill" id="budget-fill"></div></div>
        </div>

        <!-- 消費佔比圖表 -->
        <div class="card" id="chartCard">
            <h3 style="margin-top:0; color:#2F3E46;">📊 消費分類佔比</h3>
            <div style="max-width: 280px; margin: 0 auto;">
                <canvas id="expenseChart"></canvas>
            </div>
        </div>

        <!-- 成員分帳統計 -->
        <div class="card" id="payerSummaryCard">
            <h3 style="margin-top:0; color:#2F3E46;">👫 成員付款統計</h3>
            <div id="payerSummaryList" style="font-size:14px; line-height: 1.8;"></div>
        </div>

        <!-- 新增消費卡片 -->
        <div class="card">
            <h3 style="margin-top: 0; color: #2F3E46;">📝 新增消費</h3>
            <input type="text" id="itemName" placeholder="項目名稱 (例如：拉麵、藥妝)" maxlength="50" required>
            <div class="form-group">
                <div><input type="number" id="itemAmount" placeholder="金額" required min="0" max="99999999" step="any"></div>
                <div style="display:flex; gap: 5px; align-items:flex-end;">
                    <select id="itemCurrency" onchange="handleCurrencyChange(this.value)" oncontextmenu="openCurrencyContextMenu(event)" style="flex:1;" title="可點擊右側齒輪編輯匯率，或在框框上點擊右鍵">
                        <option value="JPY">日圓 (JPY)</option>
                        <option value="TWD">台幣 (TWD)</option>
                        <option value="CUSTOM_TRIGGER" style="font-weight:bold; color:#E07A5F;">➕ 其他...</option>
                    </select>
                    <button type="button" onclick="openRatesModal()" style="width:auto; padding:0 10px; height:44px; margin-top:8px; background:#E8F0EE; border:1px solid #84A59D; color:#2F3E46; font-size:16px;" title="管理幣別與匯率">⚙️</button>
                </div>
            </div>
            <div id="twdPreview" class="real-time-preview">換算台幣: NT$ 0</div>
            <div class="form-group">
                <div>
                    <select id="itemCategory">
                        <option value="餐飲">🍱 餐飲</option>
                        <option value="交通">🚃 交通</option>
                        <option value="住宿">🏨 住宿</option>
                        <option value="購物">🛍️ 購物</option>
                        <option value="娛樂">🎟️ 娛樂</option>
                        <option value="其他">📌 其他</option>
                    </select>
                </div>
                <div><input type="text" id="itemPayer" placeholder="付款人 (例: 我, 小明)" value="我" maxlength="20"></div>
            </div>
            <div class="form-group" style="margin-top:4px;">
                <div><input type="date" id="itemDate" required></div>
            </div>
            <button class="primary-btn" onclick="addExpense()">記上一筆</button>
        </div>

        <!-- 消費紀錄 -->
        <div class="card">
            <h3 style="margin-top: 0; color: #2F3E46;">🧾 消費紀錄</h3>
            <div class="filter-container">
                <div class="filter-chip active" onclick="setFilter('ALL', this)">全部</div>
                <div class="filter-chip" onclick="setFilter('餐飲', this)">🍱 餐飲</div>
                <div class="filter-chip" onclick="setFilter('交通', this)">🚃 交通</div>
                <div class="filter-chip" onclick="setFilter('住宿', this)">🏨 住宿</div>
                <div class="filter-chip" onclick="setFilter('購物', this)">🛍️️ 購物</div>
                <div class="filter-chip" onclick="setFilter('娛樂', this)">🎟️ 娛樂</div>
                <div class="filter-chip" onclick="setFilter('其他', this)">📌 其他</div>
            </div>
            <div id="expense-list"></div>
        </div>
    </div>

    <!-- 右鍵選單 -->
    <div id="currencyContextMenu" class="context-menu">
        <div class="context-menu-item" onclick="contextEditCurrency()">✏️ 編輯匯率</div>
        <div class="context-menu-item danger" onclick="contextDeleteCurrency()">🗑️ 刪除此幣別</div>
    </div>

    <!-- 編輯消費 Modal -->
    <div class="modal" id="editExpenseModal">
        <div class="modal-content">
            <h3 style="margin-top:0;">✏️ 編輯消費紀錄</h3>
            <input type="hidden" id="editExpId">
            <input type="text" id="editExpName" placeholder="項目名稱" maxlength="50">
            <div class="form-group" style="margin-top:10px;">
                <div><input type="number" id="editExpAmount" placeholder="金額" min="0" max="99999999" step="any"></div>
                <div><select id="editExpCurrency"></select></div>
            </div>
            <div class="form-group" style="margin-top:10px;">
                <div>
                    <select id="editExpCategory">
                        <option value="餐飲">🍱 餐飲</option>
                        <option value="交通">🚃 交通</option>
                        <option value="住宿">🏨 住宿</option>
                        <option value="購物">🛍️ 購物</option>
                        <option value="娛樂">🎟️ 娛樂</option>
                        <option value="其他">📌 其他</option>
                    </select>
                </div>
                <div><input type="text" id="editExpPayer" placeholder="付款人" maxlength="20"></div>
            </div>
            <div class="form-group" style="margin-top:10px;">
                <div><input type="date" id="editExpDate"></div>
            </div>
            <div class="form-group" style="margin-top:15px;">
                <button onclick="closeModal('editExpenseModal')" style="background:#ccc;">取消</button>
                <button class="primary-btn" style="margin-top:0;" onclick="saveExpenseEdit()">儲存修改</button>
            </div>
        </div>
    </div>

    <!-- 旅程彈窗 -->
    <div class="modal" id="editTripModal">
        <div class="modal-content">
            <h3 style="margin-top:0;">✏️ 編輯旅程設定</h3>
            <input type="text" id="editTripNameInput" placeholder="旅行名稱" maxlength="50">
            <div class="form-group" style="margin-top:10px;">
                <div><label style="font-size:13px;">出發：</label><input type="date" id="editTripStartInput"></div>
                <div><label style="font-size:13px;">回程：</label><input type="date" id="editTripEndInput"></div>
            </div>
            <label style="font-size:13px; margin-top:10px; display:block;">總預算 (台幣 TWD)：</label>
            <input type="number" id="editTripBudgetInput" min="0" max="999999999">
            <div class="form-group" style="margin-top:15px;">
                <button onclick="closeModal('editTripModal')" style="background:#ccc;">取消</button>
                <button class="primary-btn" style="margin-top:0;" onclick="saveTripDetails()">儲存修改</button>
            </div>
        </div>
    </div>

    <div class="modal" id="addTripModal">
        <div class="modal-content">
            <h3 style="margin-top:0;">➕ 新增旅行紀錄</h3>
            <input type="text" id="newTripNameInput" placeholder="例如：京都賞楓 6 日遊" maxlength="50">
            <div class="form-group" style="margin-top:10px;">
                <div><label style="font-size:13px;">出發：</label><input type="date" id="newTripStartInput"></div>
                <div><label style="font-size:13px;">回程：</label><input type="date" id="newTripEndInput"></div>
            </div>
            <label style="font-size:13px; margin-top:10px; display:block;">總預算 (台幣 TWD)：</label>
            <input type="number" id="newTripBudgetInput" placeholder="40000" min="0" max="999999999">
            <div class="form-group" style="margin-top:15px;">
                <button onclick="closeModal('addTripModal')" style="background:#ccc;">取消</button>
                <button class="primary-btn" style="margin-top:0;" onclick="createNewTrip()">建立</button>
            </div>
        </div>
    </div>

    <div class="modal" id="ratesModal">
        <div class="modal-content">
            <h3 style="margin-top:0;">💱 匯率設定列表</h3>
            <div id="ratesInputList"></div>
            <div class="form-group" style="margin-top:15px;">
                <button onclick="closeModal('ratesModal')" style="background:#ccc;">取消</button>
                <button class="primary-btn" style="margin-top:0;" onclick="saveRatesConfig()">更新儲存</button>
            </div>
        </div>
    </div>

    <div class="modal" id="customCurrencyModal">
        <div class="modal-content">
            <h3 style="margin-top:0;">🌐 自訂幣別與查詢</h3>
            <label style="font-size:13px; font-weight:bold;">幣別代碼：</label>
            <div class="form-group">
                <div><input type="text" id="customCodeInput" placeholder="GBP" maxlength="5" style="text-transform:uppercase;"></div>
                <div style="flex:0 0 110px;"><button class="primary-btn" style="margin-top:8px;" onclick="fetchCurrencyRate()">🔍 查詢</button></div>
            </div>
            <div id="apiStatusContainer" style="display:none;" class="api-result-box">
                <div id="apiStatusMessage">查詢中...</div>
                <div style="margin-top:8px;">
                    <label style="font-size:12px; font-weight:bold;">匯率 (對換 TWD)：</label>
                    <input type="number" id="customRateInput" step="any" min="0">
                </div>
            </div>
            <div class="form-group" style="margin-top:15px;">
                <button onclick="cancelCustomCurrency()" style="background:#ccc;">取消</button>
                <button class="primary-btn" style="margin-top:0;" id="applyCustomBtn" onclick="applyCustomCurrency()" disabled>確認帶入</button>
            </div>
        </div>
    </div>

    <script>
        // 防護 1：HTML 轉義函式 (防止 XSS 腳本攻擊)
        function escapeHTML(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        const firebaseConfig = {
            apiKey: "AIzaSyD-NlX22-qoK2M_wFV6YUIzNGvzQgFldv4",
            authDomain: "bookkeeping-app-cf680.firebaseapp.com",
            projectId: "bookkeeping-app-cf680",
            storageBucket: "bookkeeping-app-cf680.firebasestorage.app",
            messagingSenderId: "480039184522",
            appId: "1:480039184522:web:31658c3229b8fa0cef2573",
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const googleProvider = new firebase.auth.GoogleAuthProvider();

        function getLocalDateString() {
            const tzOffset = (new Date()).getTimezoneOffset() * 60000; 
            return (new Date(Date.now() - tzOffset)).toISOString().slice(0, 10);
        }

        let previousCurrency = "JPY";
        let appData = null; 
        let contextTargetCurrency = null;
        let currentFilterCategory = 'ALL';
        let expenseChart = null;
        let isFetchingRate = false; // API 發送鎖定

        const defaultAppData = {
            activeTripId: "trip_1",
            rates: { TWD: 1, JPY: 0.21, USD: 32.5, EUR: 35.0, KRW: 0.024 },
            trips: [{
                id: "trip_1", name: "我的新旅行", startDate: getLocalDateString(), endDate: getLocalDateString(), budget: 30000, expenses: []
            }]
        };

        window.addEventListener('online', checkNetworkStatus);
        window.addEventListener('offline', checkNetworkStatus);
        function checkNetworkStatus() {
            const el = document.getElementById('network-status');
            if (navigator.onLine) {
                el.style.display = 'none';
                saveData();
            } else {
                el.style.display = 'block';
            }
        }

        function loginWithGoogle() {
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('loading-overlay').style.display = 'flex';
            auth.signInWithPopup(googleProvider).catch(error => {
                alert("登入失敗：" + error.message);
                document.getElementById('loading-overlay').style.display = 'none';
                document.getElementById('login-overlay').style.display = 'flex';
            });
        }

        function logoutApp() {
            if(confirm("確定要登出嗎？")) auth.signOut();
        }

        auth.onAuthStateChanged(async (user) => {
            checkNetworkStatus();
            if (user) {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('loading-overlay').style.display = 'flex';
                document.getElementById('user-info').innerText = `已登入: ${escapeHTML(user.displayName || user.email)}`;
                
                try {
                    const docRef = db.collection("users").doc(user.uid);
                    const docSnap = await docRef.get();
                    if (docSnap.exists) {
                        appData = docSnap.data();
                    } else {
                        appData = JSON.parse(JSON.stringify(defaultAppData));
                        await docRef.set(appData); 
                    }
                    localStorage.setItem('local_trip_data', JSON.stringify(appData));
                } catch (error) {
                    console.warn("無法存取雲端，切換至本機備份模式");
                    const local = localStorage.getItem('local_trip_data');
                    if (local) appData = JSON.parse(local);
                    else appData = JSON.parse(JSON.stringify(defaultAppData));
                }
                document.getElementById('loading-overlay').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
                updateUI();
            } else {
                appData = null;
                document.getElementById('loading-overlay').style.display = 'none';
                document.getElementById('main-app').style.display = 'none';
                document.getElementById('login-overlay').style.display = 'flex';
                toggleSidebar(false);
            }
        });

        function saveData() {
            if (appData) {
                localStorage.setItem('local_trip_data', JSON.stringify(appData));
                const user = auth.currentUser;
                if (user && navigator.onLine) {
                    db.collection("users").doc(user.uid).set(appData).catch(err => {
                        console.error("雲端同步失敗", err);
                    });
                }
            }
        }

        function openCurrencyContextMenu(e) {
            e.preventDefault();
            const selectEl = document.getElementById('itemCurrency');
            const currentVal = selectEl.value;
            
            if(currentVal === 'TWD' || currentVal === 'CUSTOM_TRIGGER') {
                alert('預設選項無法編輯！若要管理其他幣別可點擊右側 ⚙️ 按鈕。');
                return;
            }
            
            contextTargetCurrency = currentVal;
            const contextMenu = document.getElementById('currencyContextMenu');
            contextMenu.style.display = 'block';
            contextMenu.style.left = Math.min(e.pageX, window.innerWidth - 120) + 'px';
            contextMenu.style.top = e.pageY + 'px';
        }

        document.addEventListener('click', (e) => {
            if (e.target.id !== 'itemCurrency') {
                document.getElementById('currencyContextMenu').style.display = 'none';
            }
        });

        function contextEditCurrency() {
            if(!contextTargetCurrency) return;
            const newRate = prompt(`請輸入 ${escapeHTML(contextTargetCurrency)} 的新匯率:`, appData.rates[contextTargetCurrency]);
            const parsedRate = parseFloat(newRate);
            if(newRate && !isNaN(parsedRate) && parsedRate > 0) {
                appData.rates[contextTargetCurrency] = parsedRate;
                saveData(); updateUI();
            } else if (newRate !== null) {
                alert('請輸入有效的數字匯率');
            }
            document.getElementById('currencyContextMenu').style.display = 'none';
        }

        function contextDeleteCurrency() {
            if(!contextTargetCurrency) return;
            if(confirm(`確定刪除 ${escapeHTML(contextTargetCurrency)} 幣別？`)) {
                delete appData.rates[contextTargetCurrency];
                saveData(); updateUI();
            }
            document.getElementById('currencyContextMenu').style.display = 'none';
        }

        function getActiveTrip() { return appData ? (appData.trips.find(t => t.id === appData.activeTripId) || appData.trips[0]) : null; }

        function updateUI() {
            const trip = getActiveTrip();
            if (!trip) return;

            document.getElementById('header-trip-name').innerText = trip.name;
            document.getElementById('header-trip-period').innerText = `${escapeHTML(trip.startDate)} ~ ${escapeHTML(trip.endDate)}`;
            document.getElementById('total-budget').innerText = Number(trip.budget || 0).toLocaleString();
            
            const selectEl = document.getElementById('itemCurrency');
            const currentVal = selectEl.value;
            selectEl.innerHTML = '';
            Object.keys(appData.rates).forEach(code => {
                const opt = document.createElement('option');
                opt.value = code;
                opt.innerText = code === 'JPY' ? '日圓 (JPY)' : (code === 'TWD' ? '台幣 (TWD)' : `${code} (${appData.rates[code]})`);
                selectEl.appendChild(opt);
            });
            const triggerOpt = document.createElement('option');
            triggerOpt.value = 'CUSTOM_TRIGGER'; triggerOpt.innerText = '➕ 其他...';
            triggerOpt.style.fontWeight = 'bold'; triggerOpt.style.color = '#E07A5F';
            selectEl.appendChild(triggerOpt);
            
            if (appData.rates[currentVal]) {
                selectEl.value = currentVal;
            } else if (appData.rates[previousCurrency]) {
                selectEl.value = previousCurrency;
            } else {
                selectEl.value = 'JPY';
            }

            const listEl = document.getElementById('expense-list');
            const spentEl = document.getElementById('total-spent');
            const fillEl = document.getElementById('budget-fill');
            listEl.innerHTML = ''; 
            let totalTWD = 0;
            const payerTotals = {};

            const sortedExpenses = [...trip.expenses].sort((a, b) => new Date(b.date) - new Date(a.date));
            const filteredExpenses = currentFilterCategory === 'ALL' ? sortedExpenses : sortedExpenses.filter(e => e.category === currentFilterCategory);

            trip.expenses.forEach(exp => {
                const twd = Math.round((parseFloat(exp.amount) || 0) * (appData.rates[exp.currency] || 1));
                totalTWD += twd;
                const payer = exp.payer || '我';
                payerTotals[payer] = (payerTotals[payer] || 0) + twd;
            });

            const payerSummaryEl = document.getElementById('payerSummaryList');
            payerSummaryEl.innerHTML = Object.keys(payerTotals).map(p => `<div>👤 <strong>${escapeHTML(p)}</strong> 已支付: NT$ ${payerTotals[p].toLocaleString()}</div>`).join('');

            let lastDate = "";
            if (filteredExpenses.length === 0) {
                listEl.innerHTML = '<p style="text-align:center; color:#84A59D; margin-top:15px;">尚無相關消費紀錄</p>';
            } else {
                filteredExpenses.forEach(exp => {
                    if (exp.date !== lastDate) {
                        lastDate = exp.date;
                        const dHeader = document.createElement('div');
                        dHeader.className = 'date-header';
                        dHeader.innerText = `📅 ${escapeHTML(exp.date)}`;
                        listEl.appendChild(dHeader);
                    }
                    const rate = appData.rates[exp.currency] || 1;
                    const twdAmount = Math.round((parseFloat(exp.amount) || 0) * rate);
                    const div = document.createElement('div');
                    div.className = 'expense-item';
                    div.innerHTML = `
                        <div>
                            <strong>${escapeHTML(exp.name)}</strong> <span class="payer-tag">${escapeHTML(exp.payer || '我')}</span><br>
                            <small style="color:#84A59D; font-weight:bold;">${escapeHTML(exp.category)}</small>
                            <br>
                            <button class="delete-btn" style="color:#84A59D; border-color:#84A59D;" onclick="openEditExpenseModal(${exp.id})">編輯</button>
                            <button class="delete-btn" onclick="deleteExpense(${exp.id})">刪除</button>
                        </div>
                        <div style="text-align: right;">
                            <strong>${escapeHTML(exp.currency)} ${Number(exp.amount).toLocaleString()}</strong><br>
                            <small style="color:#777;">≈ NT$ ${twdAmount.toLocaleString()}</small>
                        </div>
                    `;
                    listEl.appendChild(div);
                });
            }

            spentEl.innerText = totalTWD.toLocaleString();
            const percentage = trip.budget > 0 ? Math.min((totalTWD / trip.budget) * 100, 100) : 0;
            fillEl.style.width = percentage + '%';
            fillEl.style.backgroundColor = percentage >= 100 ? '#E07A5F' : (percentage >= 80 ? '#F4A261' : '#F28482');
            
            document.getElementById('itemDate').value = getLocalDateString();
            updateTWDPreview();
            renderChart(trip);
        }

        function renderChart(trip) {
            const ctx = document.getElementById('expenseChart').getContext('2d');
            const categories = {};
            trip.expenses.forEach(exp => {
                const twd = Math.round((parseFloat(exp.amount) || 0) * (appData.rates[exp.currency] || 1));
                categories[exp.category] = (categories[exp.category] || 0) + twd;
            });
            const labels = Object.keys(categories);
            const data = Object.values(categories);

            if (expenseChart) expenseChart.destroy();
            if (labels.length === 0) {
                document.getElementById('chartCard').style.display = 'none';
                return;
            }
            document.getElementById('chartCard').style.display = 'block';

            expenseChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: ['#84A59D', '#E07A5F', '#F4A261', '#2F3E46', '#D6C5B3', '#94D2BD'],
                        borderWidth: 2, borderColor: '#FFF'
                    }]
                },
                options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
            });
        }

        function addExpense() {
            const name = document.getElementById('itemName').value.trim();
            const amount = parseFloat(document.getElementById('itemAmount').value);
            const currency = document.getElementById('itemCurrency').value;
            const category = document.getElementById('itemCategory').value;
            const payer = document.getElementById('itemPayer').value.trim() || '我';
            const date = document.getElementById('itemDate').value;

            if (!name || isNaN(amount) || amount <= 0 || !date || currency === 'CUSTOM_TRIGGER') {
                return alert('請填寫正確且完整的資訊！');
            }

            getActiveTrip().expenses.unshift({ id: Date.now(), name, amount, currency, category, payer, date });
            saveData(); 
            document.getElementById('itemName').value = ''; 
            document.getElementById('itemAmount').value = '';
            updateUI();
        }

        function exportToCSV() {
            const trip = getActiveTrip();
            if (!trip || trip.expenses.length === 0) return alert('目前沒有消費紀錄可匯出！');
            
            let csv = "\uFEFF日期,分類,項目名稱,原幣金額,幣別,付款人,換算台幣(TWD)\n";
            trip.expenses.forEach(e => {
                const twd = Math.round((parseFloat(e.amount) || 0) * (appData.rates[e.currency] || 1));
                const cleanName = String(e.name).replace(/"/g, '""');
                const cleanPayer = String(e.payer || '我').replace(/"/g, '""');
                csv += `"${e.date}","${e.category}","${cleanName}",${e.amount},"${e.currency}","${cleanPayer}",${twd}\n`;
            });
            
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `${trip.name.replace(/[\\/:*?"<>|]/g, '_')}_消費明細.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            toggleSidebar(false);
        }

        function setFilter(category, el) {
            currentFilterCategory = category;
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            updateUI();
        }

        function deleteExpense(id) {
            if (confirm('確定刪除？')) {
                const trip = getActiveTrip();
                trip.expenses = trip.expenses.filter(e => e.id !== id);
                saveData(); updateUI();
            }
        }

        function openEditExpenseModal(id) {
            const exp = getActiveTrip().expenses.find(e => e.id === id);
            if (!exp) return;
            document.getElementById('editExpId').value = exp.id;
            document.getElementById('editExpName').value = exp.name;
            document.getElementById('editExpAmount').value = exp.amount;
            document.getElementById('editExpCategory').value = exp.category;
            document.getElementById('editExpPayer').value = exp.payer || '我';
            document.getElementById('editExpDate').value = exp.date;
            
            const selectEl = document.getElementById('editExpCurrency');
            selectEl.innerHTML = '';
            Object.keys(appData.rates).forEach(code => {
                const opt = document.createElement('option');
                opt.value = code; opt.innerText = code;
                selectEl.appendChild(opt);
            });
            selectEl.value = exp.currency;
            document.getElementById('editExpenseModal').classList.add('open');
        }

        function saveExpenseEdit() {
            const id = parseInt(document.getElementById('editExpId').value);
            const name = document.getElementById('editExpName').value.trim();
            const amount = parseFloat(document.getElementById('editExpAmount').value);
            const currency = document.getElementById('editExpCurrency').value;
            const category = document.getElementById('editExpCategory').value;
            const payer = document.getElementById('editExpPayer').value.trim() || '我';
            const date = document.getElementById('editExpDate').value;
            
            if (!name || isNaN(amount) || amount <= 0 || !date) return alert('請填寫完整！');
            
            const trip = getActiveTrip();
            const index = trip.expenses.findIndex(e => e.id === id);
            if (index > -1) {
                trip.expenses[index] = { ...trip.expenses[index], name, amount, currency, category, payer, date };
                saveData(); updateUI(); closeModal('editExpenseModal');
            }
        }

        function toggleSidebar(open) {
            const sidebar = document.getElementById('sidebar'); const overlay = document.getElementById('sidebarOverlay');
            if (open) {
                const container = document.getElementById('trip-list-container'); container.innerHTML = '';
                appData.trips.forEach(trip => {
                    const isActive = trip.id === appData.activeTripId;
                    const div = document.createElement('div');
                    div.className = `trip-menu-item ${isActive ? 'active' : ''}`;
                    const spent = trip.expenses.reduce((sum, e) => sum + Math.round((parseFloat(e.amount) || 0) * (appData.rates[e.currency] || 1)), 0);
                    div.innerHTML = `
                        <div onclick="switchTrip('${escapeHTML(trip.id)}')" style="flex-grow:1;">
                            <div style="font-size:15px;">${escapeHTML(trip.name)}</div>
                            <small style="color:#666;">${escapeHTML(trip.startDate)} ~ ${escapeHTML(trip.endDate)}</small><br>
                            <small style="color:#84A59D;">花費: $${spent.toLocaleString()}</small>
                        </div>
                        ${appData.trips.length > 1 ? `<span onclick="deleteTrip('${escapeHTML(trip.id)}', event)" style="color:#F28482; font-size:12px;">🗑️</span>` : ''}
                    `;
                    container.appendChild(div);
                });
                sidebar.classList.add('open'); overlay.classList.add('open');
            } else { sidebar.classList.remove('open'); overlay.classList.remove('open'); }
        }

        function switchTrip(id) { appData.activeTripId = id; saveData(); updateUI(); toggleSidebar(false); }
        function deleteTrip(id, e) { e.stopPropagation(); if (confirm('確定刪除整趟旅行？')) { appData.trips = appData.trips.filter(t => t.id !== id); appData.activeTripId = appData.trips[0].id; saveData(); updateUI(); toggleSidebar(true); } }
        function closeModal(id) { document.getElementById(id).classList.remove('open'); }
        function openEditTripModal() { const t = getActiveTrip(); document.getElementById('editTripNameInput').value = t.name; document.getElementById('editTripStartInput').value = t.startDate; document.getElementById('editTripEndInput').value = t.endDate; document.getElementById('editTripBudgetInput').value = t.budget; document.getElementById('editTripModal').classList.add('open'); }
        function saveTripDetails() {
            const name = document.getElementById('editTripNameInput').value.trim(); const start = document.getElementById('editTripStartInput').value; const end = document.getElementById('editTripEndInput').value; const budget = parseFloat(document.getElementById('editTripBudgetInput').value);
            if (!name || isNaN(budget) || budget < 0 || !start || !end) return alert('請填寫完整正確的資訊！');
            const t = getActiveTrip(); t.name = name; t.startDate = start; t.endDate = end; t.budget = budget;
            saveData(); updateUI(); closeModal('editTripModal');
        }

        function openAddTripModal() { document.getElementById('newTripNameInput').value=''; document.getElementById('newTripStartInput').value=getLocalDateString(); document.getElementById('newTripEndInput').value=getLocalDateString(); document.getElementById('addTripModal').classList.add('open'); }
        function createNewTrip() {
            const name = document.getElementById('newTripNameInput').value.trim(); const start = document.getElementById('newTripStartInput').value; const end = document.getElementById('newTripEndInput').value; const budget = parseFloat(document.getElementById('newTripBudgetInput').value) || 30000;
            if (!name) return alert('請輸入名稱！');
            const t = { id: 'trip_'+Date.now(), name, startDate: start, endDate: end, budget, expenses: [] };
            appData.trips.push(t); appData.activeTripId = t.id; saveData(); updateUI(); closeModal('addTripModal'); toggleSidebar(false);
        }

        function openRatesModal() {
            const container = document.getElementById('ratesInputList'); container.innerHTML = '';
            Object.keys(appData.rates).forEach(code => {
                const div = document.createElement('div'); div.style.display = 'flex'; div.style.marginBottom = '10px'; div.style.alignItems = 'center';
                div.innerHTML = `
                    <span style="width:80px; font-weight:bold;">${escapeHTML(code)}</span>
                    <input type="number" id="rate_${escapeHTML(code)}" value="${appData.rates[code]}" step="any" min="0" style="flex:1; margin:0;" ${code==='TWD'?'disabled':''}>
                    ${code !== 'TWD' ? `<button class="delete-btn" style="margin-left:10px; margin-top:0;" onclick="deleteRate('${escapeHTML(code)}')">刪除</button>` : ''}
                `;
                container.appendChild(div);
            });
            document.getElementById('ratesModal').classList.add('open'); toggleSidebar(false);
        }

        function deleteRate(code) { if(confirm(`確定刪除 ${escapeHTML(code)}？`)) { delete appData.rates[code]; saveData(); updateUI(); openRatesModal(); } }
        function saveRatesConfig() {
            Object.keys(appData.rates).forEach(code => { if (code !== 'TWD') { const el = document.getElementById('rate_'+code); if(el) appData.rates[code] = parseFloat(el.value) || appData.rates[code]; } });
            saveData(); updateUI(); closeModal('ratesModal');
        }

        function handleCurrencyChange(val) { if (val === 'CUSTOM_TRIGGER') { document.getElementById('customCodeInput').value=''; document.getElementById('customRateInput').value=''; document.getElementById('apiStatusContainer').style.display='none'; document.getElementById('applyCustomBtn').disabled=true; document.getElementById('customCurrencyModal').classList.add('open'); } else { previousCurrency = val; updateTWDPreview(); } }
        function cancelCustomCurrency() { closeModal('customCurrencyModal'); document.getElementById('itemCurrency').value = previousCurrency || 'JPY'; updateTWDPreview(); }
        
        // 防護 2：API 冷卻與過濾處理
        async function fetchCurrencyRate() {
            if (isFetchingRate) return;
            const rawCode = document.getElementById('customCodeInput').value.trim().toUpperCase();
            if (!rawCode || !/^[A-Z]{3,5}$/.test(rawCode)) return alert('請輸入有效的 3-5 位英文字母幣別代碼 (如 USD)');
            
            isFetchingRate = true;
            document.getElementById('apiStatusContainer').style.display = 'block'; 
            document.getElementById('apiStatusMessage').innerHTML = '⏳ 查詢中...';
            
            try {
                const res = await fetch(`https://open.er-api.com/v6/latest/${encodeURIComponent(rawCode)}`); 
                const data = await res.json();
                if (data.result === 'success' && data.rates && data.rates.TWD) { 
                    document.getElementById('apiStatusMessage').innerHTML = '✅ 取得成功'; 
                    document.getElementById('customRateInput').value = data.rates.TWD; 
                    document.getElementById('applyCustomBtn').disabled = false; 
                } else { 
                    document.getElementById('apiStatusMessage').innerHTML = '⚠️ 請手動輸入匯率'; 
                    document.getElementById('applyCustomBtn').disabled = false; 
                }
            } catch(e) { 
                document.getElementById('apiStatusMessage').innerHTML = '⚠️ 連線失敗，請手動輸入'; 
                document.getElementById('applyCustomBtn').disabled = false; 
            } finally {
                setTimeout(() => { isFetchingRate = false; }, 2000); // 限制發送頻率
            }
            document.getElementById('customRateInput').oninput = () => document.getElementById('applyCustomBtn').disabled = !(parseFloat(document.getElementById('customRateInput').value) > 0);
        }

        function applyCustomCurrency() {
            const code = document.getElementById('customCodeInput').value.trim().toUpperCase(); 
            const rate = parseFloat(document.getElementById('customRateInput').value);
            if (!code || isNaN(rate) || rate <= 0) return alert('請輸入正確的幣別與匯率');
            
            appData.rates[code] = rate; saveData(); previousCurrency = code; updateUI(); document.getElementById('itemCurrency').value = code; closeModal('customCurrencyModal'); updateTWDPreview();
        }

        function updateTWDPreview() { document.getElementById('twdPreview').innerText = `換算台幣: NT$ ${Math.round((parseFloat(document.getElementById('itemAmount').value)||0) * (appData.rates[document.getElementById('itemCurrency').value]||1)).toLocaleString()}`; }
        document.getElementById('itemAmount').addEventListener('input', updateTWDPreview);
    </script>
</body>
</html>
