<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>和風旅行帳簿 (雲端同步版)</title>
    <!-- 引入 Firebase 官方套件 -->
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        
        * { box-sizing: border-box; }
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            /* 少女系：淡粉色背景 + 稍微深一點的粉色點點 */
            background-color: #FDF3F6; 
            background-image: radial-gradient(#FDD9E3 1px, transparent 1px);
            background-size: 20px 20px;
            /* 文字改為柔和的深梅紅色/棕紅色 */
            color: #634A55; 
            margin: 0; 
            padding: 0; 
        }
        
        /* 載入中遮罩 */
        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #FDF3F6; z-index: 2000;
            display: flex; justify-content: center; align-items: center;
            font-size: 18px; font-weight: bold; color: #D97992;
        }

        .app-container {
            max-width: 600px; margin: 0 auto; padding: 15px; padding-bottom: 50px;
            display: none; /* 登入前隱藏 */
        }

        /* 登入畫面樣式 */
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #FDF3F6; background-image: radial-gradient(#FDD9E3 1px, transparent 1px);
            background-size: 20px 20px; z-index: 1000;
            display: none; justify-content: center; align-items: center; flex-direction: column; padding: 20px;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95); padding: 35px 25px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(255,166,201,0.2); width: 100%; max-width: 350px; text-align: center;
            border-top: 6px solid #FFA6C9; /* 櫻花粉 */
        }
        .login-card h2 { color: #9B6A78; margin-top: 0; font-size: 22px; }
        .login-card p { font-size: 13px; color: #D97992; margin-bottom: 25px; }

        /* 標題欄位排版更新 */
        .header { 
            background-color: #FFA6C9; color: #FFFFFF; padding: 15px 20px; 
            border-radius: 12px; display: flex; align-items: center; 
            justify-content: center; /* 讓標題置中 */
            position: relative; /* 為了讓按鈕絕對定位 */
            box-shadow: 0 4px 6px rgba(255,166,201,0.3); 
        }
        .menu-btn { 
            position: absolute; left: 20px; /* 將按鈕移到最左邊 */
            background: none; border: none; color: #FFFFFF; 
            font-size: 24px; cursor: pointer; padding: 0; margin: 0; 
        }
        .header-title-container { text-align: center; }
        .header h1 { margin: 0; font-size: 20px; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .edit-title-icon { font-size: 14px; cursor: pointer; opacity: 0.9; }
        .trip-period-text { font-size: 12px; opacity: 0.9; margin-top: 4px; color: #FFF0F5; }

        .sidebar-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.3); display: none; z-index: 99; backdrop-filter: blur(2px); }
        .sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background-color: #FDF3F6; box-shadow: 2px 0 10px rgba(255,166,201,0.3); z-index: 100; transition: left 0.3s ease; display: flex; flex-direction: column; }
        .sidebar.open { left: 0; }
        .sidebar-overlay.open { display: block; }
        .sidebar-header { background-color: #FFA6C9; color: #FFFFFF; padding: 20px; font-size: 18px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .sidebar-content { padding: 15px; flex-grow: 1; overflow-y: auto; }
        .trip-menu-item { padding: 12px 15px; margin-bottom: 8px; background: white; border-radius: 8px; border-left: 5px solid #FDD9E3; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .trip-menu-item.active { border-left-color: #FFA6C9; background-color: #FFF0F5; font-weight: bold; }
        
        .card { background: rgba(255, 255, 255, 0.95); padding: 18px; border-radius: 12px; margin-top: 15px; border-left: 6px solid #FFA6C9; box-shadow: 0 2px 8px rgba(255,166,201,0.15); }
        .budget-bar { background-color: #FDE2E4; border-radius: 8px; height: 18px; width: 100%; overflow: hidden; margin-top: 10px; }
        .budget-fill { background-color: #FF8E9E; height: 100%; width: 0%; transition: width 0.4s ease, background-color 0.4s ease; }
        .expense-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #FDD9E3; padding: 12px 0; }

        input, select, button { width: 100%; padding: 11px; margin-top: 8px; border: 1px solid #FDD9E3; border-radius: 8px; font-family: inherit; font-size: 14px; background: white; box-sizing: border-box; color: #634A55; }
        input[type="date"] { color: #FF707F; font-weight: bold; }
        button.primary-btn { background-color: #FFA6C9; color: white; border: none; font-weight: bold; cursor: pointer; font-size: 15px; margin-top: 12px; }
        .btn-google { background-color: #FF9EAE; margin-top: 10px; font-size: 16px; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .btn-logout { background-color: #FF707F; color: white; border: none; font-weight: bold; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 10px; }

        .form-group { display: flex; gap: 8px; }
        .form-group > div { flex: 1; }
        .delete-btn { background: none; border: none; color: #FF8E9E; cursor: pointer; padding: 3px 6px; width: auto; font-size: 12px; margin-top: 4px; border-radius: 4px; border: 1px solid #FF8E9E; }
        .real-time-preview { font-size: 13px; color: #D97992; margin-top: 4px; text-align: right; font-weight: bold; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 200; justify-content: center; align-items: center; padding: 20px; }
        .modal.open { display: flex; }
        .modal-content { background: white; padding: 20px; border-radius: 12px; width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto; }
        .api-result-box { background-color: #FFF0F5; border: 1px solid #FFA6C9; padding: 10px; border-radius: 8px; margin-top: 10px; font-size: 13px; }

        /* 右鍵選單樣式 */
        .context-menu {
            display: none; position: absolute; background: white;
            border: 1px solid #FDD9E3; box-shadow: 0 4px 10px rgba(255,166,201,0.2);
            z-index: 1000; border-radius: 8px; overflow: hidden; min-width: 120px;
        }
        .context-menu-item {
            padding: 10px 15px; cursor: pointer; font-size: 14px; color: #634A55;
        }
        .context-menu-item:hover { background-color: #FFF0F5; }
        .context-menu-item.danger { color: #FF707F; border-top: 1px solid #FFF0F5; }
    </style>
</head>
<body>

    <!-- 系統載入中畫面 -->
    <div id="loading-overlay">⏳ 正在連線雲端資料，請稍候...</div>

    <!-- 登入畫面 -->
    <div id="login-overlay">
        <div class="login-card">
            <h2>🌸 和風旅行帳簿</h2>
            <p>請登入您的帳號，以啟用跨裝置雲端同步功能</p>
            <button class="primary-btn btn-google" onclick="loginWithGoogle()">
                <span style="font-size:20px; background:white; border-radius:50%; padding:2px 4px; color:#FF9EAE;">G</span>
                使用 Google 帳號登入
            </button>
        </div>
    </div>

    <!-- 左側側邊欄 -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar(false)"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span>🌸 旅程選擇</span>
            <span style="cursor:pointer;" onclick="toggleSidebar(false)">✕</span>
        </div>
        <div class="sidebar-content">
            <div id="user-info" style="font-size:13px; color:#D97992; margin-bottom:10px; text-align:center;"></div>
            <div id="trip-list-container"></div>
            <button class="primary-btn" onclick="openAddTripModal()">➕ 新增旅行</button>
            <button class="primary-btn" style="background-color: #D97992;" onclick="openRatesModal()">💱 匯率設定</button>
            <button class="btn-logout" onclick="logoutApp()">🚪 登出帳號</button>
        </div>
    </div>

    <!-- 帳簿主介面 -->
    <div class="app-container" id="main-app">
        <div class="header">
            <button class="menu-btn" onclick="toggleSidebar(true)">☰</button>
            <div class="header-title-container">
                <h1>
                    <span id="header-trip-name">載入中...</span>
                    <span class="edit-title-icon" onclick="openEditTripModal()">✏️</span>
                </h1>
                <div id="header-trip-period" class="trip-period-text">--</div>
            </div>
        </div>

        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3 style="margin: 0; color: #9B6A78;">預算進度 (TWD)</h3>
                <span style="font-size:12px; color:#D97992; cursor:pointer;" onclick="openEditTripModal()">修改預算 ✏️</span>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 14px; margin-top: 10px;">
                <span>已花費: $<strong id="total-spent" style="font-size: 17px; color:#FF707F;">0</strong></span>
                <span>總預算: $<strong id="total-budget" style="font-size: 17px;">0</strong></span>
            </div>
            <div class="budget-bar"><div class="budget-fill" id="budget-fill"></div></div>
        </div>

        <div class="card">
            <h3 style="margin-top: 0; color: #9B6A78;">📝 新增消費</h3>
            <input type="text" id="itemName" placeholder="項目名稱 (例如：草莓可麗餅、藥妝)" required>
            <div class="form-group">
                <div><input type="number" id="itemAmount" placeholder="金額" required min="0" step="any"></div>
                <div>
                    <!-- 提示使用者可右鍵編輯 -->
                    <select id="itemCurrency" onchange="handleCurrencyChange(this.value)" title="點擊右鍵可編輯或刪除此幣別">
                        <option value="JPY">日圓 (JPY)</option>
                        <option value="TWD">台幣 (TWD)</option>
                        <option value="CUSTOM_TRIGGER" style="font-weight:bold; color:#FF707F;">➕ 其他...</option>
                    </select>
                </div>
            </div>
            <div id="twdPreview" class="real-time-preview">換算台幣: NT$ 0</div>
            <div class="form-group">
                <div>
                    <select id="itemCategory">
                        <option value="餐飲">🍰 餐飲</option>
                        <option value="交通">🚃 交通</option>
                        <option value="住宿">🏨 住宿</option>
                        <option value="購物">🛍️ 購物</option>
                        <option value="娛樂">🎟️ 娛樂</option>
                        <option value="其他">🎀 其他</option>
                    </select>
                </div>
                <div><input type="date" id="itemDate" required></div>
            </div>
            <button class="primary-btn" onclick="addExpense()">記上一筆</button>
        </div>

        <div class="card">
            <h3 style="margin-top: 0; color: #9B6A78;">🧾 消費紀錄</h3>
            <div id="expense-list"></div>
        </div>
    </div>

    <!-- 幣別右鍵選單 -->
    <div id="currencyContextMenu" class="context-menu">
        <div class="context-menu-item" onclick="contextEditCurrency()">✏️ 編輯匯率</div>
        <div class="context-menu-item danger" onclick="contextDeleteCurrency()">🗑️ 刪除此幣別</div>
    </div>

    <!-- Modals 彈窗 (編輯、新增、匯率、自訂幣別) -->
    <div class="modal" id="editTripModal">
        <div class="modal-content">
            <h3 style="margin-top:0; color: #9B6A78;">✏️ 編輯旅程設定</h3>
            <input type="text" id="editTripNameInput" placeholder="旅行名稱">
            <div class="form-group" style="margin-top:10px;">
                <div><label style="font-size:13px;">出發日期：</label><input type="date" id="editTripStartInput"></div>
                <div><label style="font-size:13px;">回程日期：</label><input type="date" id="editTripEndInput"></div>
            </div>
            <label style="font-size:13px; margin-top:10px; display:block;">總預算 (台幣 TWD)：</label>
            <input type="number" id="editTripBudgetInput" min="0">
            <div class="form-group" style="margin-top:15px;">
                <button onclick="closeModal('editTripModal')" style="background:#FDD9E3; color:#634A55; border:none;">取消</button>
                <button class="primary-btn" style="margin-top:0;" onclick="saveTripDetails()">儲存修改</button>
            </div>
        </div>
    </div>

    <div class="modal" id="editExpenseModal">
        <div class="modal-content">
            <h3 style="margin-top:0; color: #9B6A78;">✏️ 編輯消費紀錄</h3>
            <input type="hidden" id="editExpId">
            <input type="text" id="editExpName" placeholder="項目名稱">
            <div class="form-group" style="margin-top:10px;">
                <div><input type="number" id="editExpAmount" placeholder="金額" min="0" step="any"></div>
                <div><select id="editExpCurrency"></select></div>
            </div>
            <div class="form-group" style="margin-top:10px;">
                <div>
                    <select id="editExpCategory">
                        <option value="餐飲">🍰 餐飲</option>
                        <option value="交通">🚃 交通</option>
                        <option value="住宿">🏨 住宿</option>
                        <option value="購物">🛍️ 購物</option>
                        <option value="娛樂">🎟️ 娛樂</option>
                        <option value="其他">🎀 其他</option>
                    </select>
                </div>
                <div><input type="date" id="editExpDate"></div>
            </div>
            <div class="form-group" style="margin-top:15px;">
                <button onclick="closeModal('editExpenseModal')" style="background:#FDD9E3; color:#634A55; border:none;">取消</button>
                <button class="primary-btn" style="margin-top:0;" onclick="saveExpenseEdit()">儲存修改</button>
            </div>
        </div>
    </div>

    <div class="modal" id="addTripModal">
        <div class="modal-content">
            <h3 style="margin-top:0; color: #9B6A78;">➕ 新增旅行紀錄</h3>
            <input type="text" id="newTripNameInput" placeholder="例如：東京迪士尼小旅行">
            <div class="form-group" style="margin-top:10px;">
                <div><label style="font-size:13px;">出發：</label><input type="date" id="newTripStartInput"></div>
                <div><label style="font-size:13px;">回程：</label><input type="date" id="newTripEndInput"></div>
            </div>
            <label style="font-size:13px; margin-top:10px; display:block;">總預算 (台幣 TWD)：</label>
            <input type="number" id="newTripBudgetInput" placeholder="40000" min="0">
            <div class="form-group" style="margin-top:15px;">
                <button onclick="closeModal('addTripModal')" style="background:#FDD9E3; color:#634A55; border:none;">取消</button>
                <button class="primary-btn" style="margin-top:0;" onclick="createNewTrip()">建立</button>
            </div>
        </div>
    </div>

    <div class="modal" id="ratesModal">
        <div class="modal-content">
            <h3 style="margin-top:0; color: #9B6A78;">💱 匯率設定列表</h3>
            <div id="ratesInputList"></div>
            <div class="form-group" style="margin-top:15px;">
                <button onclick="closeModal('ratesModal')" style="background:#FDD9E3; color:#634A55; border:none;">取消</button>
                <button class="primary-btn" style="margin-top:0;" onclick="saveRatesConfig()">更新</button>
            </div>
        </div>
    </div>

    <div class="modal" id="customCurrencyModal">
        <div class="modal-content">
            <h3 style="margin-top:0; color: #9B6A78;">🌐 自訂幣別與查詢</h3>
            <label style="font-size:13px; font-weight:bold;">幣別代碼：</label>
            <div class="form-group">
                <div><input type="text" id="customCodeInput" placeholder="GBP" style="text-transform:uppercase;"></div>
                <div style="flex:0 0 110px;"><button class="primary-btn" style="margin-top:8px;" onclick="fetchCurrencyRate()">🔍 查詢</button></div>
            </div>
            <div id="apiStatusContainer" style="display:none;" class="api-result-box">
                <div id="apiStatusMessage">查詢中...</div>
                <div style="margin-top:8px;">
                    <label style="font-size:12px; font-weight:bold;">匯率 (對換 TWD)：</label>
                    <input type="number" id="customRateInput" step="any">
                </div>
            </div>
            <div class="form-group" style="margin-top:15px;">
                <button onclick="cancelCustomCurrency()" style="background:#FDD9E3; color:#634A55; border:none;">取消</button>
                <button class="primary-btn" style="margin-top:0;" id="applyCustomBtn" onclick="applyCustomCurrency()" disabled>確認帶入</button>
            </div>
        </div>
    </div>

    <script>
        /* =========================================
           1. Firebase Config 設定碼
           ========================================= */
        const firebaseConfig = {
            apiKey: "AIzaSyD-NlX22-qoK2M_wFV6YUIzNGvzQgFldv4",
   		    authDomain: "bookkeeping-app-cf680.firebaseapp.com",
   		    projectId: "bookkeeping-app-cf680",
   		    storageBucket: "bookkeeping-app-cf680.firebasestorage.app",
   		    messagingSenderId: "480039184522",
   		    appId: "1:480039184522:web:31658c3229b8fa0cef2573",
        };

        // 初始化 Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const googleProvider = new firebase.auth.GoogleAuthProvider();

        /* =========================================
           2. App 核心資料結構與變數
           ========================================= */
        function getLocalDateString() {
            const tzOffset = (new Date()).getTimezoneOffset() * 60000; 
            return (new Date(Date.now() - tzOffset)).toISOString().slice(0, 10);
        }

        let previousCurrency = "JPY";
        let appData = null; 
        let contextTargetCurrency = null; // 右鍵選單目標幣別

        const defaultAppData = {
            activeTripId: "trip_1",
            rates: { TWD: 1, JPY: 0.21, USD: 32.5, EUR: 35.0, KRW: 0.024 },
            trips: [{
                id: "trip_1", name: "我的新旅行", startDate: getLocalDateString(), endDate: getLocalDateString(), budget: 30000, expenses: []
            }]
        };

        /* =========================================
           3. 登入、登出與資料庫同步邏輯
           ========================================= */
        function loginWithGoogle() {
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('loading-overlay').style.display = 'flex';
            auth.signInWithPopup(googleProvider).catch(error => {
                alert("登入失敗：" + error.message);
                document.getElementById('loading-overlay').style.display = 'none';
                document.getElementById('login-overlay').style.display = 'flex';
            });
        }

        function logoutApp() {
            if(confirm("確定要登出嗎？")) auth.signOut();
        }

        auth.onAuthStateChanged(async (user) => {
            if (user) {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('loading-overlay').style.display = 'flex';
                document.getElementById('user-info').innerText = `已登入: ${user.displayName}`;
                
                try {
                    const docRef = db.collection("users").doc(user.uid);
                    const docSnap = await docRef.get();
                    if (docSnap.exists) {
                        appData = docSnap.data();
                    } else {
                        appData = JSON.parse(JSON.stringify(defaultAppData));
                        await docRef.set(appData); 
                    }
                    document.getElementById('loading-overlay').style.display = 'none';
                    document.getElementById('main-app').style.display = 'block';
                    updateUI();
                } catch (error) {
                    alert("讀取雲端資料失敗，請確認 Firebase 資料庫規則是否已設定為測試模式！");
                    console.error(error);
                }
            } else {
                appData = null;
                document.getElementById('loading-overlay').style.display = 'none';
                document.getElementById('main-app').style.display = 'none';
                document.getElementById('login-overlay').style.display = 'flex';
                toggleSidebar(false);
            }
        });

        function saveData() {
            const user = auth.currentUser;
            if (user && appData) {
                db.collection("users").doc(user.uid).set(appData).catch(err => {
                    console.error("雲端儲存失敗", err);
                    alert("同步失敗，請檢查網路連線！");
                });
            }
        }

        /* =========================================
           4. 右鍵選單功能
           ========================================= */
        const currencySelect = document.getElementById('itemCurrency');
        const contextMenu = document.getElementById('currencyContextMenu');

        // 監聽幣別選單右鍵事件
        currencySelect.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            const currentVal = this.value;
            
            // 防呆保護：台幣和新增按鈕不可刪除或編輯
            if(currentVal === 'TWD' || currentVal === 'CUSTOM_TRIGGER') {
                alert('系統預設選項不可編輯或刪除！');
                return;
            }
            
            contextTargetCurrency = currentVal;
            contextMenu.style.display = 'block';
            
            // 計算選單出現位置，防止超出螢幕
            let posX = e.pageX;
            let posY = e.pageY;
            if (posX + 150 > window.innerWidth) posX = window.innerWidth - 150;
            
            contextMenu.style.left = posX + 'px';
            contextMenu.style.top = posY + 'px';
        });

        // 點擊空白處關閉右鍵選單
        document.addEventListener('click', function(e) {
            if (e.target.id !== 'itemCurrency') {
                contextMenu.style.display = 'none';
            }
        });

        function contextEditCurrency() {
            if(!contextTargetCurrency) return;
            const currentRate = appData.rates[contextTargetCurrency];
            const newRate = prompt(`請輸入 ${contextTargetCurrency} 的新匯率 (對換 TWD):`, currentRate);
            
            if(newRate !== null && newRate.trim() !== '' && !isNaN(parseFloat(newRate))) {
                appData.rates[contextTargetCurrency] = parseFloat(newRate);
                saveData();
                updateUI();
                updateTWDPreview();
            }
            contextMenu.style.display = 'none';
        }

        function contextDeleteCurrency() {
            if(!contextTargetCurrency) return;
            if(confirm(`確定要刪除 ${contextTargetCurrency} 幣別嗎？\n(舊有消費紀錄不會受到影響)`)) {
                delete appData.rates[contextTargetCurrency];
                saveData();
                
                // 如果刪除的是目前選中的，則跳回預設 JPY 或 TWD
                if (currencySelect.value === contextTargetCurrency) {
                    previousCurrency = appData.rates['JPY'] ? 'JPY' : 'TWD';
                }
                updateUI();
            }
            contextMenu.style.display = 'none';
        }


        /* =========================================
           5. 介面與功能邏輯
           ========================================= */
        function getActiveTrip() {
            if (!appData) return null;
            return appData.trips.find(t => t.id === appData.activeTripId) || appData.trips[0];
        }

        function updateUI() {
            const trip = getActiveTrip();
            if (!trip) return;

            document.getElementById('header-trip-name').innerText = trip.name;
            document.getElementById('header-trip-period').innerText = `${trip.startDate} ~ ${trip.endDate}`;
            document.getElementById('total-budget').innerText = trip.budget.toLocaleString();
            
            // 幣別選單更新
            const selectEl = document.getElementById('itemCurrency');
            const currentVal = selectEl.value;
            selectEl.innerHTML = '';
            Object.keys(appData.rates).forEach(code => {
                const opt = document.createElement('option');
                opt.value = code;
                let label = code;
                if (code === 'JPY') label = '日圓 (JPY)';
                else if (code === 'TWD') label = '台幣 (TWD)';
                else if (code === 'USD') label = '美金 (USD)';
                else label = `${code} (匯率: ${appData.rates[code]})`;
                opt.innerText = label;
                selectEl.appendChild(opt);
            });
            const triggerOpt = document.createElement('option');
            triggerOpt.value = 'CUSTOM_TRIGGER'; triggerOpt.innerText = '➕ 其他 (自訂/線上查詢)...';
            triggerOpt.style.fontWeight = 'bold'; triggerOpt.style.color = '#FF707F';
            selectEl.appendChild(triggerOpt);
            
            if (appData.rates[currentVal]) selectEl.value = currentVal;
            else selectEl.value = previousCurrency || 'JPY';

            // 紀錄列表渲染
            const listEl = document.getElementById('expense-list');
            const spentEl = document.getElementById('total-spent');
            const fillEl = document.getElementById('budget-fill');
            listEl.innerHTML = ''; let totalTWD = 0;
            const sortedExpenses = [...trip.expenses].sort((a, b) => new Date(b.date) - new Date(a.date));

            if (sortedExpenses.length === 0) {
                listEl.innerHTML = '<p style="text-align:center; color:#D97992;">目前尚無紀錄</p>';
            } else {
                sortedExpenses.forEach(exp => {
                    const rate = appData.rates[exp.currency] || 1;
                    const twdAmount = Math.round(exp.amount * rate);
                    totalTWD += twdAmount;
                    const div = document.createElement('div');
                    div.className = 'expense-item';
                    div.innerHTML = `
                        <div>
                            <strong>${exp.name}</strong><br>
                            <small style="color:#D97992; font-weight:bold;">${exp.category}</small>
                            <span style="font-size:12px; color:#aaa; margin-left:6px;">${exp.date}</span>
                            <br>
                            <button class="delete-btn" style="color:#FFA6C9; border-color:#FFA6C9;" onclick="openEditExpenseModal(${exp.id})">編輯</button>
                            <button class="delete-btn" onclick="deleteExpense(${exp.id})">刪除</button>
                        </div>
                        <div style="text-align: right;">
                            <strong>${exp.currency} ${exp.amount.toLocaleString()}</strong><br>
                            <small style="color:#A48795;">≈ NT$ ${twdAmount.toLocaleString()}</small>
                        </div>
                    `;
                    listEl.appendChild(div);
                });
            }
            spentEl.innerText = totalTWD.toLocaleString();
            const percentage = trip.budget > 0 ? Math.min((totalTWD / trip.budget) * 100, 100) : 0;
            fillEl.style.width = percentage + '%';
            if (percentage >= 100) fillEl.style.backgroundColor = '#FF707F'; 
            else if (percentage >= 80) fillEl.style.backgroundColor = '#FFA384'; 
            else fillEl.style.backgroundColor = '#FF8E9E';
            
            document.getElementById('itemDate').value = getLocalDateString();
            updateTWDPreview();
        }

        // 新增消費
        function addExpense() {
            const name = document.getElementById('itemName').value.trim();
            const amount = parseFloat(document.getElementById('itemAmount').value);
            const currency = document.getElementById('itemCurrency').value;
            const category = document.getElementById('itemCategory').value;
            const date = document.getElementById('itemDate').value;
            if (!name || isNaN(amount) || amount <= 0 || !date || currency === 'CUSTOM_TRIGGER') return alert('請填寫完整資訊！');

            getActiveTrip().expenses.unshift({ id: Date.now(), name, amount, currency, category, date });
            saveData(); 
            document.getElementById('itemName').value = ''; document.getElementById('itemAmount').value = '';
            updateUI();
        }

        function deleteExpense(id) {
            if (confirm('確定刪除？')) {
                const trip = getActiveTrip();
                trip.expenses = trip.expenses.filter(e => e.id !== id);
                saveData(); updateUI();
            }
        }

        function openEditExpenseModal(id) {
            const trip = getActiveTrip();
            const exp = trip.expenses.find(e => e.id === id);
            if (!exp) return;
            
            document.getElementById('editExpId').value = exp.id;
            document.getElementById('editExpName').value = exp.name;
            document.getElementById('editExpAmount').value = exp.amount;
            document.getElementById('editExpCategory').value = exp.category;
            document.getElementById('editExpDate').value = exp.date;
            
            const selectEl = document.getElementById('editExpCurrency');
            selectEl.innerHTML = '';
            Object.keys(appData.rates).forEach(code => {
                const opt = document.createElement('option');
                opt.value = code; opt.innerText = code;
                selectEl.appendChild(opt);
            });
            selectEl.value = exp.currency;
            
            document.getElementById('editExpenseModal').classList.add('open');
        }

        function saveExpenseEdit() {
            const id = parseInt(document.getElementById('editExpId').value);
            const name = document.getElementById('editExpName').value.trim();
            const amount = parseFloat(document.getElementById('editExpAmount').value);
            const currency = document.getElementById('editExpCurrency').value;
            const category = document.getElementById('editExpCategory').value;
            const date = document.getElementById('editExpDate').value;
            
            if (!name || isNaN(amount) || amount <= 0 || !date) return alert('請填寫完整資訊！');
            
            const trip = getActiveTrip();
            const index = trip.expenses.findIndex(e => e.id === id);
            if (index > -1) {
                trip.expenses[index] = { id, name, amount, currency, category, date };
                saveData(); 
                updateUI(); 
                closeModal('editExpenseModal');
            }
        }

        function toggleSidebar(open) {
            const sidebar = document.getElementById('sidebar'); const overlay = document.getElementById('sidebarOverlay');
            if (open) {
                const container = document.getElementById('trip-list-container'); container.innerHTML = '';
                appData.trips.forEach(trip => {
                    const isActive = trip.id === appData.activeTripId;
                    const div = document.createElement('div');
                    div.className = `trip-menu-item ${isActive ? 'active' : ''}`;
                    const spent = trip.expenses.reduce((sum, e) => sum + Math.round(e.amount * (appData.rates[e.currency] || 1)), 0);
                    div.innerHTML = `
                        <div onclick="switchTrip('${trip.id}')" style="flex-grow:1;">
                            <div style="font-size:15px;">${trip.name}</div>
                            <small style="color:#A48795;">${trip.startDate} ~ ${trip.endDate}</small><br>
                            <small style="color:#D97992;">花費: $${spent.toLocaleString()}</small>
                        </div>
                        ${appData.trips.length > 1 ? `<span onclick="deleteTrip('${trip.id}', event)" style="color:#FF707F; font-size:12px;">🗑️</span>` : ''}
                    `;
                    container.appendChild(div);
                });
                sidebar.classList.add('open'); overlay.classList.add('open');
            } else { sidebar.classList.remove('open'); overlay.classList.remove('open'); }
        }

        function switchTrip(id) { appData.activeTripId = id; saveData(); updateUI(); toggleSidebar(false); }
        function deleteTrip(id, e) { e.stopPropagation(); if (confirm('確定刪除整趟旅行？')) { appData.trips = appData.trips.filter(t => t.id !== id); appData.activeTripId = appData.trips[0].id; saveData(); updateUI(); toggleSidebar(true); } }
        
        function closeModal(id) { document.getElementById(id).classList.remove('open'); }
        
        function openEditTripModal() { const t = getActiveTrip(); document.getElementById('editTripNameInput').value = t.name; document.getElementById('editTripStartInput').value = t.startDate; document.getElementById('editTripEndInput').value = t.endDate; document.getElementById('editTripBudgetInput').value = t.budget; document.getElementById('editTripModal').classList.add('open'); }
        function saveTripDetails() {
            const name = document.getElementById('editTripNameInput').value; const start = document.getElementById('editTripStartInput').value; const end = document.getElementById('editTripEndInput').value; const budget = parseFloat(document.getElementById('editTripBudgetInput').value);
            if (!name || isNaN(budget) || !start || !end) return alert('請填寫完整！');
            const t = getActiveTrip(); t.name = name; t.startDate = start; t.endDate = end; t.budget = budget;
            saveData(); updateUI(); closeModal('editTripModal');
        }

        function openAddTripModal() { document.getElementById('newTripNameInput').value=''; document.getElementById('newTripStartInput').value=getLocalDateString(); document.getElementById('newTripEndInput').value=getLocalDateString(); document.getElementById('addTripModal').classList.add('open'); }
        function createNewTrip() {
            const name = document.getElementById('newTripNameInput').value; const start = document.getElementById('newTripStartInput').value; const end = document.getElementById('newTripEndInput').value; const budget = parseFloat(document.getElementById('newTripBudgetInput').value) || 30000;
            if (!name) return alert('請輸入名稱！');
            const t = { id: 'trip_'+Date.now(), name, startDate: start, endDate: end, budget, expenses: [] };
            appData.trips.push(t); appData.activeTripId = t.id; saveData(); updateUI(); closeModal('addTripModal'); toggleSidebar(false);
        }

        function openRatesModal() {
            const container = document.getElementById('ratesInputList'); container.innerHTML = '';
            Object.keys(appData.rates).forEach(code => {
                const div = document.createElement('div'); div.style.display = 'flex'; div.style.marginBottom = '10px'; div.style.alignItems = 'center';
                div.innerHTML = `
                    <span style="width:80px; font-weight:bold; color: #634A55;">${code}</span>
                    <input type="number" id="rate_${code}" value="${appData.rates[code]}" style="flex:1; margin:0;" ${code==='TWD'?'disabled':''}>
                    ${code !== 'TWD' ? `<button class="delete-btn" style="margin-left:10px; margin-top:0;" onclick="deleteRate('${code}')">刪除</button>` : ''}
                `;
                container.appendChild(div);
            });
            document.getElementById('ratesModal').classList.add('open'); toggleSidebar(false);
        }

        function deleteRate(code) {
            if(confirm(`確定要刪除 ${code} 匯率嗎？`)) {
                delete appData.rates[code];
                saveData(); 
                updateUI(); 
                openRatesModal(); 
            }
        }

        function saveRatesConfig() {
            Object.keys(appData.rates).forEach(code => { if (code !== 'TWD') { const el = document.getElementById('rate_'+code); if(el) appData.rates[code] = parseFloat(el.value) || appData.rates[code]; } });
            saveData(); updateUI(); closeModal('ratesModal');
        }

        function handleCurrencyChange(val) { if (val === 'CUSTOM_TRIGGER') { document.getElementById('customCodeInput').value=''; document.getElementById('customRateInput').value=''; document.getElementById('apiStatusContainer').style.display='none'; document.getElementById('applyCustomBtn').disabled=true; document.getElementById('customCurrencyModal').classList.add('open'); } else { previousCurrency = val; updateTWDPreview(); } }
        function cancelCustomCurrency() { closeModal('customCurrencyModal'); document.getElementById('itemCurrency').value = previousCurrency || 'JPY'; updateTWDPreview(); }
        async function fetchCurrencyRate() {
            const rawCode = document.getElementById('customCodeInput').value.trim().toUpperCase();
            if (!rawCode) return alert('請輸入代碼');
            document.getElementById('apiStatusContainer').style.display = 'block'; document.getElementById('apiStatusMessage').innerHTML = '⏳ 查詢中...';
            try {
                const res = await fetch(`https://open.er-api.com/v6/latest/${rawCode}`); const data = await res.json();
                if (data.result === 'success' && data.rates.TWD) { document.getElementById('apiStatusMessage').innerHTML = '✅ 取得成功'; document.getElementById('customRateInput').value = data.rates.TWD; document.getElementById('applyCustomBtn').disabled = false; }
                else { document.getElementById('apiStatusMessage').innerHTML = '⚠️ 請手動輸入匯率'; document.getElementById('applyCustomBtn').disabled = false; }
            } catch(e) { document.getElementById('apiStatusMessage').innerHTML = '⚠️ 連線失敗，請手動輸入'; document.getElementById('applyCustomBtn').disabled = false; }
            document.getElementById('customRateInput').oninput = () => document.getElementById('applyCustomBtn').disabled = !parseFloat(document.getElementById('customRateInput').value);
        }
        function applyCustomCurrency() {
            const code = document.getElementById('customCodeInput').value.trim().toUpperCase(); const rate = parseFloat(document.getElementById('customRateInput').value);
            appData.rates[code] = rate; saveData(); previousCurrency = code; updateUI(); document.getElementById('itemCurrency').value = code; closeModal('customCurrencyModal'); updateTWDPreview();
        }
        function updateTWDPreview() { document.getElementById('twdPreview').innerText = `換算台幣: NT$ ${Math.round((parseFloat(document.getElementById('itemAmount').value)||0) * (appData.rates[document.getElementById('itemCurrency').value]||1)).toLocaleString()}`; }
        document.getElementById('itemAmount').addEventListener('input', updateTWDPreview);
    </script>
</body>
</html>
